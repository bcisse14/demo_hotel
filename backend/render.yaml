services:
  - type: web
    name: demo-hotel-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: 'bash -lc "composer install --no-dev --optimize-autoloader && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console app:ensure-seed && php -S 0.0.0.0:$PORT -t public"'
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: demo-hotel-db
          property: connectionString
      - key: MAILER_DSN
        value: null://null
    healthCheckPath: /api
    autoDeployTrigger: commit
databases:
  - name: demo-hotel-db
    plan: free
