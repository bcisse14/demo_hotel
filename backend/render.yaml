services:
  - type: web
    name: demo-hotel-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
  dockerCommand: '/app/docker/entrypoint.sh'
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: demo-hotel-db
          property: connectionString
      - key: MAILER_DSN
        value: null://null
    healthCheckPath: /api
    autoDeployTrigger: commit
databases:
  - name: demo-hotel-db
    plan: free
