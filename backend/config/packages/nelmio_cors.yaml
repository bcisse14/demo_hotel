nelmio_cors:
    defaults:
        allow_credentials: true
        origin_regex: true
        allow_origin: ['http://localhost:5173', 'http://127.0.0.1:5173', '^https?://(.+\.)?vercel\.app$', '%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null
